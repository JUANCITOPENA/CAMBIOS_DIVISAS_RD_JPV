<!DOCTYPE html>

<head>

<body>

    <div id="loader-overlay">
        <div class="spinner-border text-info" style="width: 4rem; height: 4rem;"></div>

                <button class="btn btn-cyber me-4" onclick="updateRates()">REFRESH</button>
                <img src="https://avatars.githubusercontent.com/u/38921558?v=4" class="profile-trigger" data-bs-toggle="modal" data-bs-target="#profileModal">
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 130px;">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold text-white">Cambios de Divisas vs DOP RD$</h1>
        </div>

        <div class="master-calc-container text-center">
            <label class="text-neon-blue small mb-2 d-block">MULTIPLICADOR (X)</label>
            <input type="number" id="master-amount" class="master-input" value="1" oninput="applyMultiplier()">
        </div>

        <div class="row g-4" id="currency-grid"></div>
    </div>
